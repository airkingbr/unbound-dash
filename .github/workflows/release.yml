name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        if: matrix.goarch == 'amd64'
        run: go test ./...

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/unbound-dash_linux_${GOARCH} ./cmd/unbound-dash

      - uses: actions/upload-artifact@v4
        with:
          name: unbound-dash_linux_${{ matrix.goarch }}
          path: dist/unbound-dash_linux_${{ matrix.goarch }}

  # A single job creates the release and uploads every binary, so the
  # matrix jobs no longer race to create the same release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/unbound-dash_linux_*
